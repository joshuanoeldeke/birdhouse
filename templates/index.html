<!DOCTYPE html>
<html>
<head>
    <title>Dad's Birdhouse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #f4f4f9; text-align: center; color: #333; max-width: 800px; margin: 0 auto; padding: 10px; }
        
        /* Navigation Buttons */
        .nav-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; color: white;}
        .btn-live { background: #e74c3c; } /* Red for Live */
        .btn-admin { background: #34495e; } /* Blue/Grey for Admin */
        .btn-upload { background: #27ae60; border: none; cursor: pointer; color: white; padding: 10px;}

        /* Gallery */
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; }
        .card { background: white; padding: 5px; margin: 5px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 45%; max-width: 200px; }
        img { width: 100%; border-radius: 5px; }
        h3 { font-size: 0.8em; margin: 5px 0; overflow-wrap: break-word; }
        
        .prediction-banner { background: #dff9fb; padding: 10px; border: 2px solid #27ae60; border-radius: 5px; margin-bottom: 20px;}
    </style>
</head>
<body>
    <h1>🐦 Smart Birdhouse</h1>

    <div class="nav-bar">
        <a href="/live" class="btn btn-live">🔴 Watch Live</a>
        <a href="/admin" class="btn btn-admin">⚙️ Status</a>
    </div>

    <div style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <form method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <button class="btn-upload" type="submit">Identify Bird</button>
        </form>
    </div>

    {% if prediction %}
    <div class="prediction-banner">
        <strong>Result:</strong> {{ prediction }}
    </div>
    {% endif %}

    <hr>
    
    <h2>Recent Visitors</h2>
    <div class="gallery">
        {% for image in images %}
        <div class="card">
            <img src="{{ url_for('static', filename='captures/' + image) }}">
            <h3>{{ image }}</h3>
        </div>
        {% endfor %}
    </div>
</body>
</html>
