<!DOCTYPE html>
<html>
<head>
    <title>Birdhouse Mission Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: white; text-align: center; padding: 20px; }
        h1 { color: #f1c40f; margin-bottom: 30px; }
        
        /* Grid Layout for the Stats */
        .dashboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .stat-card { background: #333; padding: 15px; border-radius: 10px; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        .val-label { color: #aaa; font-size: 0.9em; margin-bottom: 5px; }
        .val-number { font-size: 2.5em; font-weight: bold; margin-bottom: 10px; }
        
        /* Color classes for text */
        .text-temp { color: #e74c3c; }
        .text-cpu { color: #3498db; }
        .text-ram { color: #9b59b6; }
        
        a { color: #ccc; text-decoration: none; display: inline-block; margin-top: 30px; padding: 10px 20px; border: 1px solid #555; border-radius: 5px; }
        a:hover { background: #444; }
    </style>
</head>
<body>
    <h1>🚀 System Live Monitor</h1>
    
    <div class="dashboard">
        <div class="stat-card">
            <div class="val-label">CPU Temp</div>
            <div class="val-number text-temp"><span id="temp-val">--</span>°C</div>
            <canvas id="tempChart"></canvas>
        </div>

        <div class="stat-card">
            <div class="val-label">CPU Load</div>
            <div class="val-number text-cpu"><span id="cpu-val">--</span>%</div>
            <canvas id="cpuChart"></canvas>
        </div>

        <div class="stat-card">
            <div class="val-label">RAM Usage</div>
            <div class="val-number text-ram"><span id="ram-val">--</span>%</div>
            <canvas id="ramChart"></canvas>
        </div>
    </div>

    <br>
    <a href="/">← Back to Gallery</a>

    <script>
        // --- 1. SETUP CHARTS ---
        // Helper function to make a chart config
        function createChartConfig(color, label) {
            return {
                type: 'line',
                data: {
                    labels: Array(20).fill(''), // 20 empty points for history
                    datasets: [{
                        label: label,
                        data: Array(20).fill(0), // Start with 0s
                        borderColor: color,
                        backgroundColor: color + '33', // Add transparency
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0 // Hide dots for clean look
                    }]
                },
                options: {
                    animation: false, // Disable animation for performance
                    scales: {
                        y: { min: 0, max: 100, grid: { color: '#444' } },
                        x: { display: false } // Hide x-axis labels
                    },
                    plugins: { legend: { display: false } }
                }
            };
        }

        // Initialize the 3 charts
        const tempChart = new Chart(document.getElementById('tempChart'), createChartConfig('#e74c3c', 'Temp'));
        const cpuChart = new Chart(document.getElementById('cpuChart'), createChartConfig('#3498db', 'CPU'));
        const ramChart = new Chart(document.getElementById('ramChart'), createChartConfig('#9b59b6', 'RAM'));

        // Customize Temp chart scale (0-80C is better for temp than 0-100)
        tempChart.options.scales.y.max = 85;

        // --- 2. UPDATE FUNCTION ---
        function updateGraph(chart, newValue) {
            // Remove oldest data point
            chart.data.datasets[0].data.shift();
            // Add new data point
            chart.data.datasets[0].data.push(newValue);
            chart.update();
        }

        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                // Update Text Numbers
                document.getElementById('temp-val').innerText = data.temperature;
                document.getElementById('cpu-val').innerText = data.cpu_percent;
                document.getElementById('ram-val').innerText = data.memory_percent;

                // Update Graphs
                updateGraph(tempChart, data.temperature);
                updateGraph(cpuChart, data.cpu_percent);
                updateGraph(ramChart, data.memory_percent);

            } catch (error) {
                console.error("Error fetching stats:", error);
            }
        }

        // --- 3. START LOOP ---
        // Run immediately, then every 2000ms (2 seconds)
        fetchStats();
        setInterval(fetchStats, 2000);
    </script>
</body>
</html>
